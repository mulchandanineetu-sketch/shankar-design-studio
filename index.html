<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shankar Design Studio</title>
<style>
  :root {
    --bg: #f4f5f8;
    --panel: #ffffff;
    --ink: #1b1c22;
    --muted: #6b6d7a;
    --line: #e2e4ec;
    --accent: #6d28d9;
    --shirt: #e9e9ee;
    --shirt-line: #c9c9d4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  header {
    width: 100%;
    max-width: 900px;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 4px 0 0;
    font-size: 14px;
    color: var(--muted);
  }

  .studio {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }

  .shirt {
    position: relative;
    container-type: inline-size;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }

  .shirt svg {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 8px 16px rgba(27, 28, 34, 0.12));
  }

  .shirt .body {
    fill: var(--shirt);
    stroke: var(--shirt-line);
    stroke-width: 2;
    stroke-linejoin: round;
  }

  .shirt .collar {
    fill: none;
    stroke: var(--shirt-line);
    stroke-width: 5;
    stroke-linecap: round;
  }

  .print-area {
    position: absolute;
    left: 30%;
    top: 28%;
    width: 40%;
    height: 36%;
    padding: 2cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    border: 1px dashed transparent;
    border-radius: 8px;
    font-size: 7cqw;
    font-weight: 700;
    line-height: 1.15;
    overflow-wrap: anywhere;
    transition: color 0.15s ease;
  }

  .print-area.is-empty {
    border-color: #c3c5d4;
  }

  .template-tag {
    margin: 14px 0 0;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input[type="text"],
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #fbfbfd;
    border: 1px solid var(--line);
    border-radius: 9px;
  }

  input[type="text"]:focus,
  select:focus,
  input[type="color"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  input[type="color"] {
    width: 100%;
    height: 42px;
    padding: 4px;
    background: #fbfbfd;
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }

  .price-row .field-label { margin: 0; }

  #priceOutput {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .save-button {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 9px;
    cursor: pointer;
  }

  .save-button:hover:not(:disabled) { background: #5b21b6; }

  .save-button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .save-button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .save-status {
    margin: 0;
    min-height: 18px;
    font-size: 13px;
    line-height: 1.4;
    overflow-wrap: anywhere;
    color: var(--muted);
  }

  .save-status.is-ok { color: #157347; }

  .save-status.is-error { color: #b42318; }

  .print-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  input[type="file"] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
  }

  input[type="file"]::file-selector-button {
    margin-right: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: #fbfbfd;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .clear-button {
    align-self: flex-start;
    padding: 8px 12px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: #fbfbfd;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .clear-button:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .studio { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <h1>Shankar Design Studio</h1>
    <p>Design a Classic T-shirt with a chest print.</p>
  </header>

  <main class="studio">
    <section class="panel" aria-label="Preview">
      <div class="shirt">
        <svg viewBox="0 0 200 215" role="img" aria-label="Classic T-shirt, front view">
          <path class="body" d="M60 24 C72 46 128 46 140 24 L168 32 L196 86 L158 106 L150 88 L150 204 L50 204 L50 88 L42 106 L4 86 L32 32 Z"/>
          <path class="collar" d="M60 24 C72 46 128 46 140 24"/>
        </svg>
        <div class="print-area" id="printArea">
          <span id="printText"></span>
          <img id="printLogo" alt="" hidden>
        </div>
      </div>
      <p class="template-tag">Classic T-Shirt &middot; Chest template</p>
    </section>

    <section class="panel controls" aria-label="Design controls">
      <label class="field">
        <span class="field-label">Text</span>
        <input id="textInput" type="text" value="SHANKAR" maxlength="24" placeholder="Add text" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Logo (PNG or JPG, max 2MB)</span>
        <input id="logoInput" type="file" accept="image/png,image/jpeg">
      </label>
      <button id="clearLogoButton" class="clear-button" type="button" hidden>Remove logo</button>
      <p id="logoStatus" class="save-status" role="status" aria-live="polite"></p>

      <label class="field">
        <span class="field-label">Colour</span>
        <input id="colourInput" type="color" value="#111111">
      </label>

      <label class="field">
        <span class="field-label">Size</span>
        <select id="sizeInput">
          <option value="S">S</option>
          <option value="M" selected>M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </label>

      <div class="price-row">
        <span class="field-label">Price</span>
        <output id="priceOutput" for="textInput colourInput sizeInput" aria-live="polite">&nbsp;</output>
      </div>

      <button id="saveButton" class="save-button" type="button">Save Order</button>
      <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>
  const SUPABASE_URL = "https://esbnkkarwlfzkyastmcs.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ubFe5DgykTDUn6ASnvbb1g_teZGY4Jx";

  const PRODUCT = {
    name: "Classic T-Shirt",
    template: "Chest",
    basePrice: 500,
    sizeSurcharge: { S: 0, M: 0, L: 50, XL: 100 }
  };

  const LOGO_BUCKET = "Design";
  const LOGO_MAX_BYTES = 2 * 1024 * 1024;
  const LOGO_TYPES = { "image/png": "png", "image/jpeg": "jpg" };

  const state = { text: "SHANKAR", colour: "#111111", size: "M", logoFile: null };

  const textInput = document.getElementById("textInput");
  const colourInput = document.getElementById("colourInput");
  const sizeInput = document.getElementById("sizeInput");
  const priceOutput = document.getElementById("priceOutput");
  const printArea = document.getElementById("printArea");
  const printText = document.getElementById("printText");
  const saveButton = document.getElementById("saveButton");
  const saveStatus = document.getElementById("saveStatus");
  const logoInput = document.getElementById("logoInput");
  const logoStatus = document.getElementById("logoStatus");
  const clearLogoButton = document.getElementById("clearLogoButton");
  const printLogo = document.getElementById("printLogo");

  let supabaseClient = null;
  let logoPreviewUrl = null;

  function rupees(amount) {
    return "\u20B9" + amount.toFixed(2);
  }

  function totalPrice() {
    return PRODUCT.basePrice + PRODUCT.sizeSurcharge[state.size];
  }

  function getClient() {
    if (!window.supabase) {
      throw new Error("supabase-js did not load from the CDN. Check your internet connection and reload.");
    }
    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      throw new Error("Supabase Project URL and publishable key are not set at the top of the script in index.html.");
    }
    if (!supabaseClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }
    return supabaseClient;
  }

  function setStatus(message, kind) {
    saveStatus.textContent = message;
    saveStatus.classList.toggle("is-ok", kind === "ok");
    saveStatus.classList.toggle("is-error", kind === "error");
  }

  function setLogoStatus(message, kind) {
    logoStatus.textContent = message;
    logoStatus.classList.toggle("is-error", kind === "error");
  }

  function newObjectName() {
    if (window.crypto && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return Date.now() + "-" + Math.random().toString(36).slice(2, 10);
  }

  function clearLogo() {
    if (logoPreviewUrl) {
      URL.revokeObjectURL(logoPreviewUrl);
      logoPreviewUrl = null;
    }
    state.logoFile = null;
    logoInput.value = "";
    setLogoStatus("", null);
    render();
  }

  function chooseLogo(file) {
    const extension = LOGO_TYPES[file.type];

    if (!extension) {
      clearLogo();
      setLogoStatus("Logo must be a PNG or JPG image.", "error");
      return;
    }

    if (file.size > LOGO_MAX_BYTES) {
      clearLogo();
      setLogoStatus("Logo must be 2MB or smaller.", "error");
      return;
    }

    if (logoPreviewUrl) {
      URL.revokeObjectURL(logoPreviewUrl);
    }

    state.logoFile = file;
    logoPreviewUrl = URL.createObjectURL(file);
    setLogoStatus(file.name, null);
    render();
  }

  async function uploadLogo(client) {
    const file = state.logoFile;
    const path = "logos/" + newObjectName() + "." + LOGO_TYPES[file.type];

    const { error } = await client.storage.from(LOGO_BUCKET).upload(path, file, {
      contentType: file.type,
      upsert: false
    });

    if (error) {
      throw new Error(error.message);
    }

    return client.storage.from(LOGO_BUCKET).getPublicUrl(path).data.publicUrl;
  }

  async function saveOrder() {
    saveButton.disabled = true;
    setStatus(state.logoFile ? "Uploading logo\u2026" : "Saving\u2026", null);

    try {
      const client = getClient();
      const logoUrl = state.logoFile ? await uploadLogo(client) : null;

      setStatus("Saving\u2026", null);

      const { error } = await client.from("orders").insert({
        text_on_shirt: logoUrl ? "" : state.text.trim(),
        colour: state.colour,
        size: state.size,
        price: totalPrice(),
        logo_url: logoUrl
      });

      if (error) {
        throw new Error(error.message);
      }

      setStatus("Order saved", "ok");
    } catch (error) {
      setStatus(error.message || String(error), "error");
    } finally {
      saveButton.disabled = false;
    }
  }

  function render() {
    const text = state.text.trim();
    const hasLogo = Boolean(state.logoFile);

    printText.hidden = hasLogo;
    printLogo.hidden = !hasLogo;
    clearLogoButton.hidden = !hasLogo;
    printArea.classList.toggle("is-empty", !hasLogo && text === "");

    if (hasLogo) {
      printLogo.src = logoPreviewUrl;
      printLogo.alt = state.logoFile.name;
    } else {
      printLogo.removeAttribute("src");
      printLogo.alt = "";
      printText.textContent = text;
      printText.style.color = state.colour;
    }

    priceOutput.textContent = rupees(totalPrice());
  }

  function update(key, value) {
    state[key] = value;
    render();
  }

  textInput.addEventListener("input", (event) => update("text", event.target.value));
  colourInput.addEventListener("input", (event) => update("colour", event.target.value));
  sizeInput.addEventListener("change", (event) => update("size", event.target.value));
  saveButton.addEventListener("click", saveOrder);

  logoInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (file) {
      chooseLogo(file);
    }
  });

  clearLogoButton.addEventListener("click", clearLogo);

  render();
</script>
</body>
</html>
